# Selective verifier config override for local experiments.
#
# This enables verifier-style routing knobs only; model-backed proposals use the
# shared local Qwen backend when the calling entrypoint supports them.
local_verifier:
  enabled: true
  trigger_on_reranked_long_context: false
  trigger_below_confidence: 0.70
  min_confidence_to_override: 0.80
