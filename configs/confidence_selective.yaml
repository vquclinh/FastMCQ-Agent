# Confidence-aware selective inference — opt-in configuration.
#
# Phase 1 (observational) uses ONLY the `choice_scoring` block. Later phases add
# `confidence_router`, `v12b`, `v13`, and `selector` blocks; they are intentionally
# omitted here until their phase is implemented and approved. Nothing in this file
# affects the no-flag BTC default or `--legacy-dynamic-full`.
#
# Scoring method (AUDIT 68/69): one model forward over the exact generation prefix,
# reading the RAW next-token logits of the BARE single-token labels (A, B, ...).
# The old `canonical_answer_prefix` setting is DEPRECATED and IGNORED — the scorer
# never scores a space-prefixed continuation.
choice_scoring:
  enabled: true                  # when false, telemetry records skip scoring (fail-open, observational)
  normalization: "softmax"       # softmax over ONLY the valid labels
  batch_size: 8                  # reserved: batch questions where practical (not used in Phase 1)
