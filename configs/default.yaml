# FastMCQ-Agent default configuration.
#
# CLI flags always override these values (CLI > config > built-in default).
# The default solver is the dependency-free baseline so the container always
# produces a valid submission out of the box.

# Which solver to use: always_a | hf_generate | hf_option_score
solver: always_a

# Competition I/O contract (the harness mounts these paths).
io:
  data_dir: /data
  output: /output/pred.csv

# --- Local LLM solver settings (Phase 2B/C) ----------------------------------
# Used only when `solver` (or --solver) is hf_generate / hf_option_score.
# NOTHING is downloaded: `model_path` must point at a LOCAL model directory.
hf:
  model_path:                 # e.g. /models/my-local-model  (required for hf_*)
  solver: hf_option_score     # preferred LLM solver when one is selected
  score_mode: label_plus_choice   # option scoring: label_only | label_plus_choice | choice_only
  max_new_tokens: 8           # generation solver: short answer only
  temperature: 0.0            # 0.0 => deterministic (do_sample=False)
  max_input_tokens: 4096      # prompt budget; questions are head-tail truncated
  trust_remote_code: false    # opt-in only; keep false unless the model needs it
  device: auto                # auto => CUDA if available, else CPU

  # Optional quantized loading (bitsandbytes) so a 7B-class model fits a small
  # GPU (e.g. 7.6 GB). Default mode=null keeps the fp16/fp32 path unchanged and
  # never imports bitsandbytes. Requires CUDA + bitsandbytes when enabled.
  quantization:
    mode: null                # null | "4bit" | "8bit"
    compute_dtype: null       # null | "float16" | "bfloat16" | "float32"
    double_quant: true        # 4-bit: nested (double) quantization
    quant_type: "nf4"         # 4-bit: "nf4" | "fp4"

  save_raw: false             # log raw generations / option scores to the debug log
  log_path: outputs/run_debug.jsonl   # per-sample debug JSONL (never pred.csv)

  # --- adaptive_agent settings (used only when solver = adaptive_agent) ------
  # Minimal Viable Agent v1: deterministic profile/route/compress + option-score
  # backbone + margin confidence + simple fallback. Advanced methods are GATED
  # OFF; turning one on raises NotImplementedError (see docs/ARCHITECTURE.md §14).
  adaptive:
    primary_score_mode: label_plus_choice     # backbone score mode
    alternate_score_modes: [label_only, choice_only]   # fallback score modes
    enable_generation_fallback: true
    enable_self_consistency: false   # gated (not implemented this phase)
    enable_pal_lite: false           # gated
    enable_debate: false             # gated
    enable_tot_lite: false           # gated
    max_fallbacks_per_sample: 1      # cost cap: at most N fallback attempts
    high_margin: 0.30                # >= => accept (conservative, not tuned)
    medium_margin: 0.10              # >= => accept unless flagged
    max_context_chars: 3000          # long-context compression budget
    compress_long_context: true
    log_agent_trace: true            # write the rich per-sample JSONL trace
    allow_tier2_ambiguous: false     # keep Tier 2 off by default

# --- OpenRouter graph solver (Round 1) ---------------------------------------
# Used only when solver = openrouter_graph. Requires OPENROUTER_API_KEY (env or a
# git-ignored .env); the key is never logged/committed. Default model is the
# competition-approved Qwen3.5 (<= 9B). No OpenAI/Gemini/Claude direct APIs.
openrouter:
  model: "qwen/qwen3.5-9b"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  timeout_sec: 60
  max_retries: 3
  structured_output: true
  # Reasoning controls for reasoning-capable models. qwen3.5-9b reasons BY
  # DEFAULT; omitting the reasoning key makes it eat the whole budget and return
  # EMPTY content (Phase 2K.1/2K.2, verified). CORRECTNESS-FIRST fix: we send
  # reasoning.enabled EXPLICITLY. Default false => {"enabled": false} => reasoning
  # OFF => non-empty valid JSON for every sample, fast. Set true only with a LARGE
  # max_tokens (the provider ignores reasoning.max_tokens). See docs/OPENROUTER_ROUND1_STRATEGY.md.
  reasoning_enabled: false         # false => send {"enabled": false} (reasoning OFF)
  reasoning_effort: null           # null | "low" | "medium" | "high" (when enabled)
  reasoning_max_tokens: null       # cap reasoning tokens (when enabled; provider may ignore)
  reasoning_exclude: true          # drop reasoning text from the response (when enabled)
  enable_verifier: true            # deterministic/structural check (NOT an extra API call)
  enable_repair: true              # one extra call ONLY when needed (see below)
  repair_only_on_invalid: true     # default fast path: repair only if no valid label
  enable_self_consistency: false   # gated: only low-confidence samples, off by default
  self_consistency_k: 3
  # API-call budget per sample (speed): normal path = 1 call; with a repair = 2.
  max_api_calls_per_sample_default: 1
  max_api_calls_per_sample_with_repair: 2
  max_samples_for_smoke: 3
  # Deterministic calculation helper (PAL-lite) for the calculation route. When a
  # high-confidence closed-form family matches (decay/Hess/cylinder/elasticity/
  # expectation/resistor), use its label and SKIP the LLM call. Conservative:
  # overrides only at confidence >= calc_min_confidence; otherwise the LLM answers.
  calc_enabled: true
  calc_override_when_safe: true
  calc_min_confidence: 0.95

# --- Prompt / runtime placeholders (informational) ---------------------------
prompt:
  strategy: zero_shot         # zero_shot | few_shot | cot

runtime:
  batch_size: 8
  seed: 42
