# Adaptive reasoning orchestrator config.
#
# Overlay config for local-only trace/assist experiments. These settings never
# contact a remote provider and never read credentials.
adaptive_reasoning:
  enabled: false
  mode: "trace_only"
  calculation_programmatic:
    enabled: true
    allow_override: false
  short_knowledge_verifier:
    enabled: false
    allow_override: false
    trigger_confidence_max: 0.95
    max_local_model_calls: 0
    require_strong_confidence: true
  long_context_evidence_check:
    enabled: true
    allow_answer_change: false
  law_admin_verifier:
    enabled: false
    allow_override: false
    trigger_confidence_max: 0.95
    max_local_model_calls: 0
  ambiguous_adjudicator:
    enabled: false
    allow_override: false
    max_local_model_calls: 0
  selective_self_consistency:
    enabled: false
    n_samples: 3
    temperature: 0.2
    max_local_model_calls: 0
    allow_override: false
